name: Build IPTV Playlist

on:
  schedule:
    # Every 30 minutes
    - cron: '*/30 * * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      should_deploy: ${{ steps.check.outputs.skip == 'false' && 'true' || 'false' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --prefer-offline

      - name: Check if build needed
        id: check
        run: |
          if [ -f "playlist.m3u" ]; then
            AGE=$(( $(date +%s) - $(stat -c %Y playlist.m3u) ))
            if [ $AGE -lt 9000 ]; then
              echo "Skipping: playlist is only $((AGE/60/60)) hours old"
              echo "skip=true" >> $GITHUB_OUTPUT
            else
              echo "Building: playlist is $((AGE/60/60)) hours old"
              echo "skip=false" >> $GITHUB_OUTPUT
            fi
          else
            echo "Building: no playlist found"
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: Build playlist
        if: steps.check.outputs.skip != 'true'
        run: node scripts/build-m3u.js

      - name: Commit and push playlist
        if: steps.check.outputs.skip != 'true'
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          git config user.name "juzkev"
          git config user.email "juzkev@gmail.com"
          git remote set-url origin https://x-access-token:$GH_PAT@github.com/juzkev/anbox-iptv.git
          git add playlist.m3u
          if ! git diff --cached --quiet; then
            git commit -m "Update playlist $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
            git push
          fi
