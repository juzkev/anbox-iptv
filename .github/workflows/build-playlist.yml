name: Build IPTV Playlist

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Build playlist
        run: |
          mkdir -p scripts
          # Copy build script from repo or generate inline
          node -e "
          const fs = require('fs');
          const http = require('http');
          const https = require('https');
          // Simplified version for CI
          console.log('Building playlist...');
          // Full build logic here
          const playlist = '#EXTM3U\\n#Generated: ' + new Date().toISOString() + '\\n#EXTINF:-1,Test Channel\\nhttp://example.com/stream.ts\\n';
          fs.writeFileSync('playlist.m3u', playlist);
          console.log('Done');
          "
      
      - name: Commit changes
        run: |
          git config user.name \"github-actions[bot]\"
          git config user.email \"github-actions[bot]@users.noreply.github.com\"
          git add playlist.m3u
          git diff --cached --quiet || git commit -m \"Update playlist $(date -u '+%Y-%m-%d %H:%M:%S')\"
          git push
