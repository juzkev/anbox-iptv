name: Build IPTV Playlist

on:
  schedule:
    # Every 2 hours - playlists don't change frequently
    - cron: '0 */2 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --prefer-offline

      - name: Check if build needed
        id: check
        run: |
          if [ -f "playlist.m3u" ]; then
            AGE=$(( $(date +%s) - $(stat -c %Y playlist.m3u) ))
            if [ $AGE -lt 9000 ]; then
              echo "Skipping: playlist is only $((AGE/60/60)) hours old"
              echo "skip=true" >> $GITHUB_OUTPUT
            else
              echo "Building: playlist is $((AGE/60/60)) hours old"
              echo "skip=false" >> $GITHUB_OUTPUT
            fi
          else
            echo "Building: no playlist found"
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: Build playlist
        if: steps.check.outputs.skip != 'true'
        run: node scripts/build-m3u.js

      - name: Commit and push if changed
        if: steps.check.outputs.skip != 'true'
        run: |
          git config user.name "juzkev"
          git config user.email "juzkev@gmail.com"
          git add playlist.m3u portal-status.json
          if ! git diff --cached --quiet; then
            git commit -m "Update playlist $(date -u '+%Y-%m-%d %H:%M:%S')"
            git push
          fi

  pages:
    needs: build
    if: always() && needs.build.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  report:
    needs: [build, pages]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Report status
        run: |
          echo "Build: ${{ needs.build.result }}"
          echo "Pages: ${{ needs.pages.result }}"
          echo "Playlist: https://juzkev.github.io/anbox-iptv/playlist.m3u"
