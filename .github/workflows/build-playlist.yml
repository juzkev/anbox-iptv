name: Build IPTV Playlist

on:
  schedule:
    # Every 30 minutes
    - cron: '*/30 * * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --prefer-offline

      - name: Check if build needed
        id: check
        run: |
          if [ -f "playlist.m3u" ]; then
            AGE=$(( $(date +%s) - $(stat -c %Y playlist.m3u) ))
            if [ $AGE -lt 9000 ]; then
              echo "Skipping: playlist is only $((AGE/60/60)) hours old"
              echo "skip=true" >> $GITHUB_OUTPUT
            else
              echo "Building: playlist is $((AGE/60/60)) hours old"
              echo "skip=false" >> $GITHUB_OUTPUT
            fi
          else
            echo "Building: no playlist found"
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: Build playlist
        if: steps.check.outputs.skip != 'true'
        run: node scripts/build-m3u.js

      - name: Commit and push changes
        if: steps.check.outputs.skip != 'true'
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          github_token: ${{ secrets.GH_PAT }}
          commit_message: "Update IPTV playlist"
          file_pattern: playlist.m3u anime-all.m3u
